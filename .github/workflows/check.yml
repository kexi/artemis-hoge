name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - run: nix develop --command just setup-project
      - run: nix develop --command just check-project
      - run: nix develop --command pinact run --check
      - run: nix develop --command actionlint
      - run: nix flake check
